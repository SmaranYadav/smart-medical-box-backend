databases:
  - name: smart-medical-box-db
    databaseName: smart_medical_box
    user: smart_medical_box
    plan: free

services:
  - type: web
    name: smart-medical-box-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-medical-box-db
          property: connectionString
